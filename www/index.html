:root{--bg:#0a0a12;--card:#13131f;--card2:#1a1a2b;--tx:#f2f2f8;--mut:#8b8ba3;--ac:#ff2e63;--ac2:#7c3aed;--ok:#22e0a1;--bad:#ff4d4d;--bd:#2a2a40;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:light){:root:not([data-theme="dark"]){--bg:#f3f3f9;--card:#fff;--card2:#ececf6;--tx:#14141f;--mut:#5d5d78;--bd:#d8d8e8}}
:root[data-theme="dark"]{--bg:#0a0a12}
*{box-sizing:border-box}html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--tx);font-family:LRP,Tahoma,sans-serif;font-weight:700;font-size:1.15rem;min-height:100vh;background-image:radial-gradient(circle at 80% -10%,rgba(124,58,237,.28),transparent 50%),radial-gradient(circle at 10% 110%,rgba(255,46,99,.22),transparent 45%),linear-gradient(rgba(124,58,237,.06) 1px,transparent 1px),linear-gradient(90deg,rgba(124,58,237,.06) 1px,transparent 1px);background-size:auto,auto,38px 38px,38px 38px}
.ic{width:1.2em;height:1.2em;fill:currentColor;fill-opacity:.16;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;vertical-align:-.2em;flex:none}
.wrap{max-width:1000px;margin:auto;padding:16px 14px 60px}
header{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:12px}
.logo{font-weight:900;font-size:1.5rem;letter-spacing:1px;direction:ltr;background:linear-gradient(90deg,var(--ac),var(--ac2),#38bdf8,var(--ac));background-size:300%;-webkit-background-clip:text;background-clip:text;color:transparent;animation:fl 6s linear infinite;cursor:pointer}
@keyframes fl{to{background-position:300%}}

@media(max-width:640px){}

.btn{background:linear-gradient(135deg,var(--ac),var(--ac2));color:#fff;border:0;border-radius:12px;padding:11px 18px;font:700 .95rem LRP,Tahoma,sans-serif;cursor:pointer;display:inline-flex;gap:8px;align-items:center;transition:.2s;box-shadow:0 6px 22px rgba(255,46,99,.3)}
.btn:hover{transform:translateY(-2px)}.btn.g{background:var(--card2);box-shadow:none;color:var(--tx);border:1px solid var(--bd)}.btn.d{background:rgba(255,77,77,.15);color:var(--bad);box-shadow:none}.btn.s{padding:7px 12px;font-size:.82rem}
input,textarea,select{width:100%;background:var(--card2);border:1px solid var(--bd);color:var(--tx);border-radius:12px;padding:12px 14px;font:inherit;outline:0}
input:focus,textarea:focus,select:focus{border-color:var(--ac)}input[type=checkbox]{width:auto}
label{font-size:.82rem;color:var(--mut);display:block;margin:12px 0 5px}
.hero{text-align:center;padding:26px 0 18px}.hero h1{font-size:clamp(2rem,8vw,3.6rem);margin:0 0 10px;font-weight:900;line-height:1.3}
.hero h1 span,.gt{background:linear-gradient(90deg,var(--ac),var(--ac2));-webkit-background-clip:text;background-clip:text;color:transparent}
.hero p{color:var(--mut);margin:0 auto 22px;max-width:520px}
.box{background:var(--card);border:1px solid var(--bd);border-radius:20px;padding:22px;max-width:460px;margin:0 auto 16px}
.row{display:flex;gap:10px}.err{color:var(--bad);font-size:.88rem;min-height:1.3em;margin-top:10px}.ok{color:var(--ok)}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin:26px 0}.stats div{background:var(--card);border:1px solid var(--bd);border-radius:18px;padding:16px;text-align:center}.stats b{font-size:1.9rem;display:block}.stats small{color:var(--mut)}
.pc{background:var(--card);border:1px solid var(--bd);border-radius:24px;overflow:hidden;animation:up .5s}
@keyframes up{from{opacity:0;transform:translateY(16px)}}
.top{display:flex;gap:22px;align-items:center;padding:26px;background:linear-gradient(135deg,rgba(255,46,99,.18),rgba(124,58,237,.18));flex-wrap:wrap}
.top img{width:130px;height:130px;border-radius:24px;object-fit:cover;border:3px solid var(--ac);box-shadow:0 0 30px rgba(255,46,99,.45)}
.top h2{margin:0;font-size:1.7rem;font-weight:900;display:flex;gap:8px;align-items:center}.top small{color:var(--mut)}
.tag{display:inline-flex;gap:6px;align-items:center;padding:5px 12px;border-radius:99px;background:var(--card2);border:1px solid var(--bd);font-size:.82rem;margin:8px 6px 0 0}
.s1{color:var(--ok)}.s2{color:#ffb020}.s3{color:var(--bad)}
.tick{width:1.35em;height:1.35em;filter:drop-shadow(0 0 6px #3897f0);animation:gl 2.4s ease-in-out infinite}

<div class="f2">${f('name','اسم',p.name)}${f('gname','اسم گیم',p.gname)}${f('game','گیم',p.game)}${f('age','سن',p.age,'number')}<div><label>فکشن</label><select id="f_faction">${F.map(x=>`<option ${x.n===p.faction?'selected':''}>${e(x.n)}</option>`).join('')}</select></div>${f('rank','کار در فکشن',p.rank)}${f('level','لول',p.level,'number')}<div><label>وضعیت</label><select id="f_status">${SN.map((s,i)=>`<option value="${i}" ${i===p.status?'selected':''}>${s}</option>`).join('')}</select></div>
<div><label>${ic('key')} رمز پلیر</label><div class="row"><input id="f_code" dir="ltr" value="${e(p.code)}"><button class="btn g s" onclick="$('#f_code').value='P-'+Math.random().toString(36).slice(2,7).toUpperCase()">تصادفی</button></div></div><div><label>تیک آبی ${tk()}</label><input type="checkbox" id="f_ver" ${p.verified?'checked':''} style="width:24px;height:24px"></div></div>
<label>${ic('card')} عکس کارت عضویت فکشن (آپلود)</label><input type="file" accept="image/*" onchange="pic(this,'card',700,0)">${p.card?`<img class="cimg" style="margin-top:8px" src="${e(p.card)}" alt=""><button class="btn d s" style="margin-top:6px" onclick="tmp.card='';P.find(x=>x.id===${p.id}).card='';sv('gp2',P);render()">حذف کارت</button>`:''}
${rg('anger','درصد عصبانیت',p.anger)}${rg('kind','درصد مهربانی',p.kind)}<label>سابقه کاری (هر خط یک مورد)</label><textarea id="f_hist" rows="4">${e((p.hist||[]).join('\n'))}</textarea><label>توضیحات</label><textarea id="f_bio" rows="2">${e(p.bio)}</textarea><div class="err">${e(msg)}</div>
<div class="acts"><button class="btn" onclick="save(${p.id})">ذخیره</button>${p.id?`<button class="btn d" onclick="del(${p.id})">${ic('trash')} حذف</button>`:''}</div>`}
function pic(i,k,w,sq){const fl=i.files[0];if(!fl)return;const r=new FileReader();r.onload=()=>{const im=new Image();im.onload=()=>{const c=document.createElement('canvas'),x=c.getContext('2d');if(sq){const s=Math.min(im.width,im.height);c.width=c.height=w;x.drawImage(im,(im.width-s)/2,(im.height-s)/2,s,s,0,0,w,w)}else{const h=im.height*Math.min(1,w/im.width);c.width=Math.min(w,im.width);c.height=h;x.drawImage(im,0,0,c.width,h)}tmp[k]=c.toDataURL('image/jpeg',.82);if(k==='photo')$('#pv').src=tmp[k];else snd.ok()};im.src=r.result};r.readAsDataURL(fl)}
function save(id){const g=k=>$('#f_'+k).value.trim();if(!g('gname')||!g('code')){msg='اسم گیم و رمز الزامی است.';snd.err();return render()}
if(P.some(x=>x.id!==id&&x.code.toLowerCase()===g('code').toLowerCase())){msg='این رمز قبلاً استفاده شده.';snd.err();return render()}
const old=P.find(x=>x.id===id)||{},o={id:id||Date.now(),code:g('code'),name:g('name'),gname:g('gname'),game:g('game'),age:+g('age')||0,faction:$('#f_faction').value,rank:g('rank'),level:+g('level')||1,status:+$('#f_status').value,anger:+$('#f_anger').value,kind:+$('#f_kind').value,verified:$('#f_ver').checked?1:0,hist:$('#f_hist').value.split('\n').map(s=>s.trim()).filter(Boolean),bio:g('bio'),photo:tmp.photo||old.photo||'',card:tmp.card||old.card||''};
tmp={};P=id?P.map(x=>x.id===id?o:x):[...P,o];sv('gp2',P);eid=o.id;msg='';snd.ok();render()}
function del(id){if(confirm(lang==='en'?'Delete this player?':'این پلیر حذف شود؟')){P=P.filter(x=>x.id!==id);sv('gp2',P);eid=null;render()}}
render();
</script></body></html>
